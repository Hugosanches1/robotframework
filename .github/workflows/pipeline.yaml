name: Robot Framework CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixar código
    - name: Checkout do repositório
      uses: actions/checkout@v4

    # 2. Configurar Python
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    # 3. Instalar dependências
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Instalar Chrome (necessário para Selenium)
    - name: Instalar Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
    # Remover chromedriver antigo (IMPORTANTE)
    - name: Limpar ChromeDriver antigo
      run: |
        sudo apt-get remove -y chromium-chromedriver || true
        sudo rm -f /usr/bin/chromedriver || true

    # 5. Rodar testes (headless obrigatório em CI)
    - name: Executar testes Robot Framework
      run: |
        robot --variable HEADLESS:True--outputdir results tests/

    # 6. Upload dos relatórios do Robot Framework
    - name: Upload relatórios
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: robot-reports
        path: |
          results/output.xml
          results/log.html
          results/report.html

    # 7. Upload das screenshots (evidências)
    - name: Upload screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: screenshots-evidencias
        path: screenshots/